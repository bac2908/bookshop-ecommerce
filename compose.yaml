name: tmdt-bookshop

services:
  mysql:
    image: mysql:8.4.10
    container_name: bookshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookshop}
      MYSQL_USER: ${MYSQL_USER:-bookshop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bookshop_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bookshop_root_dev}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - bookshop_mysql_data:/var/lib/mysql

volumes:
  bookshop_mysql_data:
