spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

spring.mail.username=test@example.invalid
spring.mail.password=test-only
paypal.client.app=test-client
paypal.client.secret=test-secret
paypal.refund.enabled=false
app.scheduling.enabled=false

upload.path=${java.io.tmpdir}/bookshop-integration-upload
