# Local Java connects to the Docker MySQL port. Inside Compose, DB_URL is
# overridden to use the mysql service name and port 3306.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3308}/bookshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:bookshop}
spring.datasource.password=${DB_PASSWORD:bookshop_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# Docker databases are managed exclusively by Flyway.
spring.flyway.baseline-on-migrate=false
