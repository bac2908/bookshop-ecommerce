# Docker Compose listens on 3308 by default so it can coexist with AMPPS and
# other local MySQL containers.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3308}/bookshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:bookshop}
spring.datasource.password=${DB_PASSWORD:bookshop_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# Existing AMPPS databases predate Flyway. A non-empty schema is recorded at V1;
# a new empty Docker database executes V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
