# The default is convenient for local development. Deployments must set
# SPRING_PROFILES_ACTIVE=prod explicitly.
spring.profiles.default=dev

# ================== Mail ==================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ================== Error page ==================
server.error.whitelabel.enabled=false
server.error.path=/error

# ================== Upload ==================
upload.path=${UPLOAD_PATH:upload/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ================== PayPal ==================
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.client.app=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.brand=${PAYPAL_BRAND:Book Shop}
paypal.refund.enabled=${PAYPAL_REFUND_ENABLED:false}

# ================== Login lock ==================
auth.user.max-fail=${AUTH_USER_MAX_FAIL:5}
auth.user.window-minutes=${AUTH_USER_WINDOW_MINUTES:1}
auth.user.lock-minutes=${AUTH_USER_LOCK_MINUTES:1}
auth.ip.max-fail=${AUTH_IP_MAX_FAIL:6}
auth.ip.window-minutes=${AUTH_IP_WINDOW_MINUTES:1}
auth.ip.lock-minutes=${AUTH_IP_LOCK_MINUTES:1}

# Keep NONE unless forwarding headers are sanitized by a trusted reverse proxy.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}
